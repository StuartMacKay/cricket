x-app-environment: &app-environment
  DJANGO_ENV:
  DJANGO_SECRET_KEY:
  DJANGO_ALLOWED_HOSTS:
  DJANGO_WATCHMAN_TOKENS:
  DJANGO_DEBUG:
  DJANGO_LOG_LEVEL:
  DJANGO_SENTRY_DSN:

x-app: &default-app
  build:
    context: "."
    target: "app"
    args:
      - "UID=${UID:-1000}"
      - "GID=${GID:-1000}"
  depends_on:
    redis:
      condition: "service_started"
      required: false
  environment: *app-environment
  init: true
  restart: "unless-stopped"
  tty: true

services:
  redis:
    image: "redis:7.2"
    command: "redis-server --appendonly yes"
    restart: "unless-stopped"
    volumes:
      - "redisdata:/data"

  django:
    <<: *default-app
    environment:
      <<: *app-environment
      GUNICORN_NUMBER_OF_WORKERS:
      GUNICORN_NUMBER_OF_THREADS:
      GUNICORN_MAX_REQUESTS:
      GUNICORN_TIMEOUT:
      GUNICORN_RELOAD:
      GUNICORN_LOG_LEVEL:
    healthcheck:
      test: "curl localhost:8000/watchman/ping"
      interval: "60s"
      timeout: "3s"
      start_period: "30s"
      retries: 3
    volumes:
      - "data:/app/data"
      - "media:/app/media"
      - "static:/app/static"

  celery-beat:
    <<: *default-app
    command: celery -A config beat --loglevel "${CELERY_LOG_LEVEL:-warning}"
    depends_on:
      django:
        condition: "service_started"
        required: false
    entrypoint: null

  celery-worker:
    <<: *default-app
    command: celery -A config worker --loglevel "${CELERY_LOG_LEVEL:-warning}" -Q sites,pages
    depends_on:
      django:
        condition: "service_started"
        required: false
    entrypoint: null
    volumes:
      - "data:/app/data"
      - "media:/app/media"

volumes:
  data:
    {}
  redisdata:
    {}
  media:
    {}
  static:
    {}
